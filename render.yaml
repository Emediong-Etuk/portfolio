databases:
  - name: portfolio-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run db:deploy && npm run db:ensure-seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: GITHUB_USERNAME
        value: Emediong-Etuk
