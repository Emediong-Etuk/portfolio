services:
  - type: web
    name: portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run db:deploy && npm run db:ensure-seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Render allows only one free-tier Postgres database per account.
      # Bring your own connection string from a free provider (Neon,
      # Supabase, etc.) instead of provisioning a Render database here —
      # see README.md "Deployment (Render)" for the Neon walkthrough.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: GITHUB_USERNAME
        value: Emediong-Etuk
